# The application config for qits-egress as a standalone process (ordinal 250). The domain jar
# ships its datasource and Flyway lineage at ordinal 100 in META-INF/microprofile-config.properties.
# A deployment still overrides any of it by env.

quarkus.application.name=qits-egress

# Every route of the MANAGEMENT listener (8080, behind the public edge at egress.qits.<domain>)
# lives under /egress: the API at /egress/api, and Quarkus' own non-application root (health) at
# /egress/q, where the deploy gates on /egress/q/health/ready (.config/qits/deployments.yml).
# Spelled as two absolute paths rather than quarkus.http.root-path, as every sibling service does.
#
# The PROXY listener (8081, qits-2620) is a Vert.x server of its own, reached only on the wire
# alias ${QITS_ENVIRONMENT}-qits-egress:8081; nothing here configures it.
quarkus.rest.path=/egress/api
quarkus.http.non-application-root-path=/egress/q

# --- machine identity -----------------------------------------------------------------------------
# EVERY DOOR TAKES A BEARER: there is no anonymous door here but health.
#
# THE ROLLOUT GATE SHIPS ON (qits.auth.machine.required, defaulted false by qits-auth-core — this
# literal overrides that library default at ordinal 250). On, quarkus-oidc validates every bearer
# against qits-idp; off, there is no OIDC tenant at all. %dev./%test. put it off, which is what lets
# a clone-alone `./mvnw verify` need no issuer: the suites state their callers themselves.
qits.auth.machine.required=true
quarkus.oidc.tenant-enabled=${qits.auth.machine.required:false}
%dev.qits.auth.machine.required=false
%test.qits.auth.machine.required=false

# Bearer-only: this service starts no login flow and holds no session.
#
# THE IDP IS DIALLED AT ITS EDGE HOST: https://idp.qits.<domain>/idp, never a wire alias.
# QITS_DOMAIN is injected into every container by qits-deployments and carries NO default here: a
# deployment without it refuses to start rather than validating against a half name.
quarkus.oidc.auth-server-url=https://idp.qits.${QITS_DOMAIN}/idp
quarkus.oidc.application-type=service

# ONE audience on this platform, carried by every token — a service's, a person's, an agent's
# commissioned token alike — so it is a literal: what a caller may do is decided by its roles.
quarkus.oidc.token.audience=qits-platform

# AN UNREACHABLE IDP DOES NOT STOP THIS SERVICE: the boot-time JWKS fetch fails to a WARN and is
# retried for connection-delay, and readiness stays independent of idp.
quarkus.oidc.connection-delay=30S

# A ROTATED idp key reaches this service in seconds rather than the default ten minutes.
quarkus.oidc.token.forced-jwk-refresh-interval=PT5S

# --- the token this service PRESENTS ---------------------------------------------------------------
# ONE named client, `qits`: this process's own qits-idp service client by client credentials, the
# `idp:client` resource .config/qits/deployments.yml declares (id `<env>-qits-egress`).
# qits-telemetry-core asks OidcClients for it by name. Its id and secret are also the HTTP Basic pair
# the proxy introspects opaque tokens with and exchanges platform-route bearers with (qits-2620,
# qits-2623). Reference the raw env names inside `${…}`: QITS_RESOURCE_* has no dotted twin.
quarkus.oidc-client.qits.auth-server-url=${qits.egress.idp.url}
quarkus.oidc-client.qits.discovery-enabled=false
quarkus.oidc-client.qits.token-path=token
quarkus.oidc-client.qits.client-id=${QITS_RESOURCE_IDP_CLIENT_ID:dev-qits-egress}
quarkus.oidc-client.qits.credentials.secret=${QITS_RESOURCE_IDP_CLIENT_SECRET:}
quarkus.oidc-client.qits.grant.type=client
quarkus.oidc-client.qits.grant-options.client.audience=qits-platform
quarkus.oidc-client.qits.early-tokens-acquisition=false
quarkus.oidc-client.qits.client-enabled=true
%dev.quarkus.oidc-client.qits.client-enabled=false
%test.quarkus.oidc-client.qits.client-enabled=false

# --- qits-idp ---------------------------------------------------------------------------------------
# The url ends in /idp. Through the edge, as every platform host is reached.
qits.egress.idp.url=${QITS_RESOURCE_IDP_URL:https://idp.qits.${QITS_DOMAIN}/idp}

# --- shutdown --------------------------------------------------------------------------------------
# Two replicas behind one VIP, and a restart must drop no call in flight. On SIGTERM: first the
# DELAY (10 s), while swarm takes the task out of the VIP and readiness answers DOWN, so no new call
# arrives; then the drain, which waits for in-flight requests (and, from qits-2620, the proxy's
# tunnels and streams) up to the TIMEOUT (5 m). stop_grace_period: 6m in deployments.yml is above
# that sum. Unlike qits-edge, open streams are NOT closed early.
quarkus.shutdown.delay-enabled=true
quarkus.shutdown.delay=10s
quarkus.shutdown.timeout=5m
%test.quarkus.shutdown.delay=0s

# --- native ----------------------------------------------------------------------------------------
# NOTHING HERE IS FOUND BY java.util.ServiceLoader TODAY. The first code that is (a provider loaded
# from META-INF/services) must add quarkus.native.auto-service-loader-registration=true in the same
# commit: Quarkus turns GraalVM's service-loader feature off, and the native binary then finds no
# provider at all while every JVM test passes (qits-agents 2026.1123.194720).

# --- the packaged artifact -------------------------------------------------------------------------
# The binary is `qits-egress` (no -runner suffix); spelled again as failsafe's native.image.path in
# service/pom.xml and in docker/Dockerfile. The three move together.
quarkus.package.output-name=qits-egress
quarkus.package.jar.add-runner-suffix=false

# --- telemetry -------------------------------------------------------------------------------------
# OTLP to qits-observability through the edge, by qits-telemetry-core's CDI exporters that attach
# the `qits` client's bearer: the audit lines (logger eu.wohlben.qits.egress.audit) reach
# `qits observe` this way. The three log keys are spelled out because Quarkus still labels its
# OpenTelemetry logging PREVIEW: a changed default must be a diff, not a silence.
quarkus.otel.traces.exporter=cdi
quarkus.otel.logs.enabled=true
quarkus.otel.logs.handler.enabled=true
quarkus.otel.logs.exporter=cdi
quarkus.otel.logs.level=INFO
quarkus.otel.metrics.enabled=true
quarkus.otel.metrics.exporter=cdi
%dev.quarkus.otel.sdk.disabled=true
%test.quarkus.otel.sdk.disabled=true
