# TEST-ONLY OVERRIDES. src/main/resources/application.properties is merged into the test config, so
# nothing it says is repeated here; a key appears only where the suite needs a different value.

# QITS_DOMAIN has no default in the shipped file; the idp address expands it.
QITS_DOMAIN=wohlben.eu

# The datasource runs against an EMBEDDED POSTGRES (testdb/EmbeddedPgConfigSource supplies the url).
# clean-at-start wipes the schema between Quarkus restarts.
quarkus.flyway.egress.clean-at-start=true

# No dev services: a clone tests green with no docker.
quarkus.devservices.enabled=false

# A free port, never 8081 (the platform's npm registry on the deployment host, and this service's
# own proxy port). The proxy listener takes a free port too (%test.qits.egress.proxy.port=0 in the
# shipped file); EgressProxy.port() says which.
quarkus.http.test-port=0

# OpenApiSchemaExportTest writes docs/openapi.yml; info.version pinned so the file changes only with
# the API.
quarkus.smallrye-openapi.info-version=0

# The gateway suites: the idp is testdb/MockIdpConfigSource's MockIdp (discovery, JWKS and a stubbed
# introspection), the fake upstream is plain http, and one route secret is held.
qits.egress.test.allow-plain-http=true
qits.egress.idp.client-secret=suite-egress-secret
QITS_EGRESS_SECRET_SUITE_UPSTREAM=suite-upstream-secret-value
qits.egress.grants.refresh=1s

# The userflows class orderer, installed the one way quarkus-junit permits (a secondary orderer): story
# classes sharing a profile run in @UserflowPrecondition order.
junit.quarkus.orderer.secondary-orderer=eu.wohlben.qits.userflows.UserflowClassOrderer
