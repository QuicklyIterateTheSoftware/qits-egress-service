# How this repository releases: the packaged java-service recipe (qits-ci-service
# ci/src/main/resources/release-archetypes/java-service.yml) — build and test the fold, then push the
# one image and publish the declared contracts.
archetype: java-service

artifacts:
  - { type: docker, name: qits/qits-egress, sbom: .sbom/sbom.json }
  # The committed OpenAPI document, published as `@apidocs/qits-egress` on every release
  # (OpenApiSchemaExportTest keeps it current): the grant-table door.
  - { type: docs, name: "@apidocs/qits-egress", path: docs/openapi.yml }

# The userflow catalogue (service/src/test/.../stories/**IT), published as @userflows/qits-egress:
# the java-service recipe's build-and-test step requires */target/userstories from the verify.
userflows: qits-egress

# The provider golden masters: the platform packages `golden-masters/` as
# `eu.wohlben.qits:qits-egress-golden-masters` (maven) and `@qits/egress-golden-masters` (npm).
# contracts/GoldenMasterRecordingTest records them; the consumer is qits-deployments' push client.
#
# THE PACTS this service writes as a consumer, flat in `pacts/`:
#   qits-idp-service       quarkus-oidc's discovery and JWKS reads (which the proxy listener's caller
#                          identity reads too), the `qits` client's mint, and the opaque-token
#                          introspection (contracts/consumer/IdpPactTest, IdpTokenMintPactTest,
#                          IdpIntrospectionPactTest).
#   qits-certificates-service  the per-host leaf, POST /certificates/api/leaves, state `leaf issued`
#                          (contracts/consumer/CertificatesPactTest; tls/LeafDoor, qits-2643).
#
# No entity map and no entity diagram: the grant table is stored by plain JDBC (one row, a JSON
# body), so there is no @Entity to map.
contracts:
  application: qits-egress
  golden-masters: { from: golden-masters/, packages: [maven, npm] }
  pacts:
    qits-idp-service: { packages: [maven] }
    qits-certificates-service: { packages: [maven] }
