# qits-egress domain defaults, shipped from this library jar at ordinal 100. The deployable's
# application.properties (250) and the environment (300) override any of them.
#
# THE PLATFORM'S GENERIC RESOURCE CONTRACT. .config/qits/deployments.yml declares
# `postgresql:db:qits_egress`; qits-deployments creates the role and the database before the
# container starts and injects QITS_RESOURCE_DB_URL / _USERNAME / _PASSWORD. No defaults, on purpose:
# an unset variable fails the boot at Flyway naming what is missing, rather than opening some store
# nobody meant. The suite supplies the values (service/src/test/.../testdb/EmbeddedPgConfigSource).
#
# ONE DATABASE FOR BOTH REPLICAS: the grant table qits-deployments pushes is stored here, so the
# replica that took the PUT and the one that did not read the same table.
quarkus.datasource.egress.db-kind=postgresql
quarkus.datasource.egress.jdbc.url=${QITS_RESOURCE_DB_URL}
quarkus.datasource.egress.username=${QITS_RESOURCE_DB_USERNAME}
quarkus.datasource.egress.password=${QITS_RESOURCE_DB_PASSWORD}

# THE POOL SURVIVES A POSTGRES CUTOVER. All three lines or none: DatasourceBaselineTest fails the
# build if one goes missing.
quarkus.datasource.egress.jdbc.driver=eu.wohlben.qits.db.PatientPgDriver
quarkus.datasource.egress.jdbc.acquisition-timeout=15S
quarkus.datasource.egress.jdbc.validate-on-borrow=true

# Own Flyway lineage, hand-written and appended to. No baseline-on-migrate: every database this
# lineage meets is empty or was created by it. `schemas` makes Flyway create the schema and keep
# its history table there.
#
# The persistence unit (quarkus.hibernate-orm.egress.*, schema `egress`) comes with the first
# entity, in qits-2620.
quarkus.flyway.egress.migrate-at-start=true
quarkus.flyway.egress.schemas=egress
quarkus.flyway.egress.locations=classpath:db/egress/migration
